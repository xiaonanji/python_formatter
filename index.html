<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Python String Formatter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
  <link rel="shortcut icon" href="favicon/favicon.ico">
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main class="page">
    <header class="hero">
      <div>
        <p class="eyebrow">Format Python Structured Strings</p>
        <h1>Instant formatting for better readability</h1>
        <p class="lede">Paste Python-style list/dict strings on the left, click "Format", and see the neatly indented
          result on the right.</p>
      </div>
      <div class="status" id="status">Loading formatter...</div>
    </header>

    <section class="workbench">
      <div class="panel" id="left-panel">
        <div class="panel-header">
          <h2>Input</h2>
          <button type="button" id="format-btn" disabled>Format</button>
        </div>
        <div class="input-wrapper">
          <div id="input-line-numbers" class="line-numbers"></div>
          <textarea id="input" placeholder="Enter Python string here"></textarea>
        </div>
      </div>
      <div class="resizer" id="drag-handle"></div>
      <div class="panel" id="right-panel">
        <div class="panel-header">
          <h2>Output</h2>
          <button type="button" id="copy-btn" disabled>Copy Result</button>
        </div>
        <pre id="output" aria-live="polite"></pre>
      </div>
    </section>
    <footer class="site-footer">
      <p>Sean Ji</p>
    </footer>
  </main>

  <script src="https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js"></script>
  <script src="script.js"></script>
</body>

</html>
