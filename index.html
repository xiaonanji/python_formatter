<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Python 字符串格式化工具</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page">
    <header class="hero">
      <div>
        <p class="eyebrow">格式化 Python 结构字符串</p>
        <h1>一键排版，让长字符串更易读</h1>
        <p class="lede">在左侧输入或黏贴 Python 风格的列表 / 字典字符串，点击“格式化”，右侧立即显示整齐缩进的结果。该页面为纯静态文件，可直接部署到 EdgeOne。</p>
      </div>
      <div class="status" id="status">正在加载格式化器...</div>
    </header>

    <section class="workbench">
      <div class="panel">
        <div class="panel-header">
          <h2>输入</h2>
          <button type="button" id="format-btn" disabled>格式化</button>
        </div>
        <textarea id="input" placeholder="在此输入 Python 字符串"></textarea>
      </div>
      <div class="panel">
        <div class="panel-header">
          <h2>输出</h2>
          <button type="button" id="copy-btn" disabled>复制结果</button>
        </div>
        <pre id="output" aria-live="polite"></pre>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js"></script>
  <script src="script.js"></script>
</body>
</html>
